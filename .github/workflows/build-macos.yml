name: macOS build

# Сборка .app для macOS на раннере GitHub Actions (Mac не нужен).
# Запуск: вкладка Actions → macOS build → Run workflow.
# Артефакт: LocalTranscriber-macos-arm64 (zip с LocalTranscriber.app).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    # macOS 14 в GitHub Actions снят с поддержки 02.11.2026; macos-15 — arm64.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest==9.2.0 ruff==0.17.5 mypy==2.4.1 pyinstaller==6.22.3

      - name: Environment info
        run: |
          python -VV
          python -c "import sys, sysconfig; print(sys.executable); print(sysconfig.get_config_var('Py_ENABLE_SHARED'))"
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)" || echo "TKINTER MISSING"
          python -m pytest --version && python -m ruff --version && python -m mypy --version

      # Проверки идут отдельными вызовами с `set +e` (иначе `bash -e` обрывает
      # скрипт на первой ошибке и аннотация не печатается). Хвост вывода уходит
      # в аннотацию: логи job в GitHub API требуют токен, аннотации — нет.
      - name: Tests, lint, types
        shell: bash
        run: |
          set +e
          fail=0
          log=/tmp/ci-checks.log
          : > "$log"
          run_check() {
            name="$1"; shift
            echo "=== $name ===" >> "$log"
            out=$("$@" 2>&1); rc=$?
            printf '%s\n' "$out" >> "$log"
            if [ "$rc" -ne 0 ]; then
              msg=$(printf '%s' "$out" | tail -n 20 | tr '\n' '~' | cut -c1-800)
              echo "::error title=$name exit $rc::$msg"
              fail=1
            fi
          }
          run_check pytest python -m pytest -o addopts="" -q
          run_check ruff python -m ruff check .
          run_check mypy python -m mypy src
          tail -n 80 "$log"
          exit $fail

      - name: Build .app
        shell: bash
        env:
          LT_NO_VENV: "1"
        run: |
          set +e
          out=$(bash scripts/build_mac.sh 2>&1); rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -n 25 | tr '\n' '~' | cut -c1-900)
            echo "::error title=build_mac.sh exit $rc::$msg"
          fi
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-macos-arm64
          path: dist/LocalTranscriber-macos.zip
          if-no-files-found: error
